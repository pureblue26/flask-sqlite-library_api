# 基础镜像默认走 DaoCloud 代理，这样 `docker compose up -d` 不必直连 Docker Hub。
# 能访问 Docker Hub 时，可在项目根目录 `.env` 里改回官方镜像，例如：
#   POSTGRES_IMAGE=postgres:16
#   PYTHON_IMAGE=python:3.12-slim
#   NGINX_IMAGE=nginx:alpine

services:
  # ---- 数据库 ----
  db:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16}
    container_name: library_db
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library123
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- 后端 API（FastAPI）----
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
    container_name: library_app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: db  # 容器内连数据库用服务名（127.0.0.1 在容器内是"自己"）
    env_file:
      - .env.${APP_ENV:-dev}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- 前端 + 反向代理（Nginx）----
  web:
    build:
      context: ./frontend
      dockerfile: dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:alpine}
    container_name: library_web
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  pgdata:
