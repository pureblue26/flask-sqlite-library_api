services:
  # ---- 数据库 ----
  db:
    image: postgres:16
    container_name: library_db
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library123
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- 后端 API（FastAPI）----
  app:
    build: .
    container_name: library_app
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_HOST: db  # 容器内连数据库用服务名（127.0.0.1 在容器内是"自己"）
    env_file:
      - .env.${APP_ENV:-dev}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- 前端 + 反向代理（Nginx）----
  web:
    build: ./frontend
    container_name: library_web
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  pgdata:
