<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ---- 顶部导航 ---- */
        .navbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-user {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .navbar-user strong { color: var(--text); }

        /* ---- 布局 ---- */
        .page { max-width: 960px; margin: 0 auto; padding: 32px 20px; }

        /* ---- 认证卡片 ---- */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - 60px - 64px);
            padding-top: 40px;
        }
        .auth-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            padding: 32px 32px 24px;
            color: white;
            text-align: center;
        }
        .auth-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .auth-header p { font-size: 14px; opacity: 0.85; }

        /* Tab 切换 */
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        .auth-tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: none;
            transition: color 0.2s, border-color 0.2s;
            border-bottom: 2px solid transparent;
        }
        .auth-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .auth-tab:hover:not(.active) { color: var(--text); }

        .auth-body { padding: 28px 32px 32px; }

        /* 表单 */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background: white;
        }
        .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; width: 100%; padding: 12px; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover { background: #eff6ff; }
        .btn-sm { padding: 6px 14px; font-size: 13px; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-warning { background: var(--warning); color: white; }

        /* 消息提示 */
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .alert.show { display: block; }
        .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

        /* ---- 用户设置面板 ---- */
        .settings-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .settings-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .settings-body { padding: 24px; }
        .settings-section { margin-bottom: 24px; }
        .settings-section:last-child { margin-bottom: 0; }
        .settings-section h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 14px;
        }
        .settings-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .settings-row .form-group { flex: 1; margin-bottom: 0; }

        /* ---- 图书区 ---- */
        .books-card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .books-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            font-size: 15px;
        }
        .books-body { padding: 24px; }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .toolbar input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 120px;
            outline: none;
        }
        .toolbar input:focus { border-color: var(--primary); }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #f8fafc; color: var(--text-muted); font-weight: 600; font-size: 13px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-orange { background: #ffedd5; color: #9a3412; }

        .msg { margin-top: 16px; padding: 10px 14px; border-radius: 8px; display: none; font-size: 13px; }
        .msg.ok { display: block; background: #f0fdf4; color: #166534; }
        .msg.err { display: block; background: #fef2f2; color: #991b1b; }

        .hidden { display: none !important; }

        /* 折叠面板 */
        .collapse-toggle {
            font-size: 13px;
            color: var(--primary);
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 600;
        }
        .collapse-toggle:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .auth-body { padding: 20px; }
            .settings-row { flex-direction: column; }
            .toolbar { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar">
    <div class="navbar-brand">📚 图书管理系统</div>
    <div class="navbar-user hidden" id="navUser">
        <span>欢迎，<strong id="navUsername"></strong></span>
        <button class="btn btn-sm btn-danger" onclick="logout()">退出登录</button>
    </div>
</nav>

<!-- ===== 未登录：认证页面 ===== -->
<div id="authPage" class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>欢迎使用图书管理系统</h2>
            <p>请登录或注册账号以继续</p>
        </div>

        <!-- Tab 切换 -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">登录</button>
            <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">注册</button>
        </div>

        <div class="auth-body">
            <div class="alert" id="authAlert"></div>

            <!-- 登录表单 -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
            </form>

            <!-- 注册表单 -->
            <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regUsername">用户名</label>
                    <input type="text" id="regUsername" placeholder="3-50 个字符" autocomplete="username" required minlength="3" maxlength="50">
                    <p class="form-hint">用户名将用于登录，注册后不可与他人重复</p>
                </div>
                <div class="form-group">
                    <label for="regPassword">密码</label>
                    <input type="password" id="regPassword" placeholder="至少 6 位" autocomplete="new-password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="regPasswordConfirm">确认密码</label>
                    <input type="password" id="regPasswordConfirm" placeholder="再次输入密码" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="registerBtn">注 册</button>
            </form>
        </div>
    </div>
</div>

<!-- ===== 已登录：主页面 ===== -->
<div id="mainPage" class="page hidden">

    <!-- 账号设置 -->
    <div class="settings-card">
        <div class="settings-header">
            <span>⚙️ 账号设置</span>
            <button class="collapse-toggle" onclick="toggleSettings()" id="settingsToggle">收起</button>
        </div>
        <div class="settings-body" id="settingsBody">
            <div class="settings-section">
                <h3>基本信息</h3>
                <div class="settings-row">
                    <div class="form-group">
                        <label>当前用户名</label>
                        <input type="text" id="currentUsername" readonly style="background:#f1f5f9;cursor:default;">
                    </div>
                    <div class="form-group">
                        <label for="newUsername">新用户名</label>
                        <input type="text" id="newUsername" placeholder="输入新用户名">
                    </div>
                    <button class="btn btn-outline btn-sm" style="margin-bottom:0;white-space:nowrap;" onclick="handleUpdateUsername()">修改用户名</button>
                </div>
                <div class="alert" id="usernameAlert" style="margin-top:12px;"></div>
            </div>

            <div class="settings-section">
                <h3>修改密码</h3>
                <div class="settings-row">
                    <div class="form-group">
                        <label for="newPassword">新密码</label>
                        <input type="password" id="newPassword" placeholder="至少 6 位" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">确认新密码</label>
                        <input type="password" id="confirmPassword" placeholder="再次输入新密码">
                    </div>
                    <button class="btn btn-primary btn-sm" style="margin-bottom:0;white-space:nowrap;width:auto;" onclick="handleChangePassword()">修改密码</button>
                </div>
                <div class="alert" id="passwordAlert" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <!-- 图书管理 -->
    <div class="books-card">
        <div class="books-header">📖 图书列表</div>
        <div class="books-body">
            <div class="toolbar">
                <input type="text" id="searchQuery" placeholder="搜索书名或作者..." oninput="debounceSearch()">
                <input type="text" id="newTitle" placeholder="书名">
                <input type="text" id="newAuthor" placeholder="作者">
                <input type="number" id="newYear" placeholder="出版年份">
                <button class="btn btn-success btn-sm" onclick="createBook()">添加图书</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>书名</th><th>作者</th><th>年份</th><th>状态</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="bookList"></tbody>
            </table>
            <div class="msg" id="msg"></div>
        </div>
    </div>
</div>

<script>
    const API = "/api";
    const TOKEN_KEY = "library_token";

    let token = localStorage.getItem(TOKEN_KEY);
    let currentUser = null;
    let searchTimer = null;

    // ---- 初始化 ----
    document.addEventListener("DOMContentLoaded", async () => {
        if (token) {
            await restoreSession();
        }
    });

    async function restoreSession() {
        try {
            const res = await api("/users/me");
            if (res.ok) {
                currentUser = await res.json();
                showMainPage();
                loadBooks();
            } else {
                clearSession();
            }
        } catch {
            clearSession();
        }
    }

    function showMainPage() {
        document.getElementById("authPage").classList.add("hidden");
        document.getElementById("mainPage").classList.remove("hidden");
        document.getElementById("navUser").classList.remove("hidden");
        document.getElementById("navUsername").textContent = currentUser.username;
        document.getElementById("currentUsername").value = currentUser.username;
    }

    function showAuthPage() {
        document.getElementById("authPage").classList.remove("hidden");
        document.getElementById("mainPage").classList.add("hidden");
        document.getElementById("navUser").classList.add("hidden");
    }

    function clearSession() {
        token = null;
        currentUser = null;
        localStorage.removeItem(TOKEN_KEY);
        showAuthPage();
    }

    function logout() {
        clearSession();
        switchAuthTab("login");
    }

    // ---- Tab 切换 ----
    function switchAuthTab(tab) {
        document.getElementById("tabLogin").classList.toggle("active", tab === "login");
        document.getElementById("tabRegister").classList.toggle("active", tab === "register");
        document.getElementById("loginForm").classList.toggle("hidden", tab !== "login");
        document.getElementById("registerForm").classList.toggle("hidden", tab !== "register");
        hideAuthAlert();
    }

    function toggleSettings() {
        const body = document.getElementById("settingsBody");
        const toggle = document.getElementById("settingsToggle");
        const hidden = body.classList.toggle("hidden");
        toggle.textContent = hidden ? "展开" : "收起";
    }

    // ---- 消息提示 ----
    function showAuthAlert(msg, type = "error") {
        const el = document.getElementById("authAlert");
        el.textContent = msg;
        el.className = `alert show alert-${type === "success" ? "success" : "error"}`;
    }

    function hideAuthAlert() {
        document.getElementById("authAlert").className = "alert";
    }

    function showSectionAlert(id, msg, type = "error") {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.className = `alert show alert-${type === "success" ? "success" : "error"}`;
        setTimeout(() => { el.className = "alert"; }, 4000);
    }

    // ---- 登录 ----
    async function handleLogin(e) {
        e.preventDefault();
        hideAuthAlert();
        const btn = document.getElementById("loginBtn");
        btn.disabled = true;
        btn.textContent = "登录中...";

        const username = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value;

        try {
            const res = await fetch(`${API}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            });
            const data = await res.json();
            if (res.ok) {
                token = data.access_token;
                localStorage.setItem(TOKEN_KEY, token);
                currentUser = { username };
                const meRes = await api("/users/me");
                if (meRes.ok) currentUser = await meRes.json();
                showMainPage();
                loadBooks();
            } else {
                showAuthAlert(data.message || "登录失败，请检查用户名和密码");
            }
        } catch {
            showAuthAlert("网络错误，请稍后重试");
        } finally {
            btn.disabled = false;
            btn.textContent = "登 录";
        }
    }

    // ---- 注册 ----
    async function handleRegister(e) {
        e.preventDefault();
        hideAuthAlert();

        const username = document.getElementById("regUsername").value.trim();
        const password = document.getElementById("regPassword").value;
        const confirm = document.getElementById("regPasswordConfirm").value;

        if (password !== confirm) {
            showAuthAlert("两次输入的密码不一致");
            return;
        }
        if (password.length < 6) {
            showAuthAlert("密码长度至少 6 位");
            return;
        }

        const btn = document.getElementById("registerBtn");
        btn.disabled = true;
        btn.textContent = "注册中...";

        try {
            const res = await fetch(`${API}/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            });
            const data = await res.json();
            if (res.ok) {
                showAuthAlert("注册成功！正在为您登录...", "success");
                // 注册成功后自动登录
                const loginRes = await fetch(`${API}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });
                const loginData = await loginRes.json();
                if (loginRes.ok) {
                    token = loginData.access_token;
                    localStorage.setItem(TOKEN_KEY, token);
                    currentUser = data;
                    setTimeout(() => { showMainPage(); loadBooks(); }, 800);
                } else {
                    switchAuthTab("login");
                    document.getElementById("loginUsername").value = username;
                    showAuthAlert("注册成功，请手动登录", "success");
                }
            } else {
                showAuthAlert(data.message || "注册失败");
            }
        } catch {
            showAuthAlert("网络错误，请稍后重试");
        } finally {
            btn.disabled = false;
            btn.textContent = "注 册";
        }
    }

    // ---- 修改密码 ----
    async function handleChangePassword() {
        const newPwd = document.getElementById("newPassword").value;
        const confirmPwd = document.getElementById("confirmPassword").value;

        if (!newPwd) {
            showSectionAlert("passwordAlert", "请输入新密码");
            return;
        }
        if (newPwd.length < 6) {
            showSectionAlert("passwordAlert", "密码长度至少 6 位");
            return;
        }
        if (newPwd !== confirmPwd) {
            showSectionAlert("passwordAlert", "两次输入的密码不一致");
            return;
        }

        try {
            const res = await api(`/users/me/update-password?new_password=${encodeURIComponent(newPwd)}`, {
                method: "POST",
            });
            const data = await res.json();
            if (res.ok) {
                showSectionAlert("passwordAlert", "密码修改成功！", "success");
                document.getElementById("newPassword").value = "";
                document.getElementById("confirmPassword").value = "";
            } else {
                showSectionAlert("passwordAlert", data.message || "修改失败");
            }
        } catch {
            showSectionAlert("passwordAlert", "网络错误，请稍后重试");
        }
    }

    // ---- 修改用户名 ----
    async function handleUpdateUsername() {
        const newName = document.getElementById("newUsername").value.trim();
        if (!newName) {
            showSectionAlert("usernameAlert", "请输入新用户名");
            return;
        }
        if (newName === currentUser.username) {
            showSectionAlert("usernameAlert", "新用户名与当前用户名相同");
            return;
        }

        try {
            const res = await api(`/users/me/update-name?new_username=${encodeURIComponent(newName)}`, {
                method: "POST",
            });
            const data = await res.json();
            if (res.ok) {
                currentUser = data;
                document.getElementById("currentUsername").value = data.username;
                document.getElementById("navUsername").textContent = data.username;
                document.getElementById("newUsername").value = "";
                showSectionAlert("usernameAlert", "用户名修改成功！", "success");
            } else {
                showSectionAlert("usernameAlert", data.message || "修改失败");
            }
        } catch {
            showSectionAlert("usernameAlert", "网络错误，请稍后重试");
        }
    }

    // ---- API 工具 ----
    async function api(path, options = {}) {
        const headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = `Bearer ${token}`;
        return fetch(`${API}${path}`, { ...options, headers });
    }

    // ---- 图书操作 ----
    function debounceSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadBooks, 300);
    }

    async function loadBooks() {
        const q = document.getElementById("searchQuery")?.value.trim();
        const path = q ? `/books?q=${encodeURIComponent(q)}` : "/books";
        const res = await api(path);
        const books = await res.json();
        const tbody = document.getElementById("bookList");
        tbody.innerHTML = "";

        if (!books.length) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px;">暂无图书</td></tr>`;
            return;
        }

        books.forEach(b => {
            const tr = document.createElement("tr");
            const isAvailable = b.status === "available";
            const statusBadge = isAvailable
                ? `<span class="badge badge-green">在馆</span>`
                : `<span class="badge badge-orange">已借出</span>`;
            const action = isAvailable
                ? `<button class="btn btn-primary btn-sm" onclick="borrowBook(${b.id})">借书</button>`
                : `<button class="btn btn-warning btn-sm" onclick="returnBook(${b.id})">还书</button>`;
            tr.innerHTML = `
                <td>${b.id}</td>
                <td>${escapeHtml(b.title)}</td>
                <td>${escapeHtml(b.author)}</td>
                <td>${b.published_year || "-"}</td>
                <td>${statusBadge}</td>
                <td>${action}</td>`;
            tbody.appendChild(tr);
        });
    }

    async function borrowBook(id) {
        const res = await api(`/books/${id}/borrow`, { method: "POST" });
        showMsg(res);
        loadBooks();
    }

    async function returnBook(id) {
        const res = await api(`/books/${id}/return`, { method: "POST" });
        showMsg(res);
        loadBooks();
    }

    async function createBook() {
        const title = document.getElementById("newTitle").value.trim();
        const author = document.getElementById("newAuthor").value.trim();
        const year = document.getElementById("newYear").value;
        if (!title || !author) {
            showMsgDirect("err", "书名和作者不能为空");
            return;
        }
        const res = await api("/books", {
            method: "POST",
            body: JSON.stringify({ title, author, published_year: year ? parseInt(year) : null }),
        });
        showMsg(res);
        if (res.ok) {
            document.getElementById("newTitle").value = "";
            document.getElementById("newAuthor").value = "";
            document.getElementById("newYear").value = "";
        }
        loadBooks();
    }

    function showMsg(res) {
        if (res.ok) {
            showMsgDirect("ok", "操作成功");
        } else {
            res.json().then(d => showMsgDirect("err", d.message || "操作失败"));
        }
    }

    function showMsgDirect(type, text) {
        const msg = document.getElementById("msg");
        msg.className = `msg ${type}`;
        msg.textContent = text;
        setTimeout(() => { msg.className = "msg"; }, 3000);
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }
</script>
</body>
</html>
